name: Android APK
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_USER_HOME: /tmp/ai-moa-gradle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - name: Configure official plugin dependency repositories
        run: |
          mkdir -p "$GRADLE_USER_HOME/init.d"
          cp tool/gradle.init.gradle "$GRADLE_USER_HOME/init.d/moa.gradle"
      - name: Test signing configuration
        run: python3 -m unittest discover -s test -p "*_test.py"
      - run: bash tool/prepare.sh
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Create disposable PR signing fixture
        if: github.event_name == 'pull_request'
        run: python3 tool/create-test-signing.py
      - name: Restore fixed release key from four Secrets
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 tool/restore-signing.py
      - name: Build ARM64 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          ANDROID_RELEASE_KEYSTORE="$RUNNER_TEMP/ai-moa-release.p12" ANDROID_RELEASE_PASSWORD="$(cat "$RUNNER_TEMP/ai-moa-release.password")" ANDROID_RELEASE_KEY_ALIAS="$(cat "$RUNNER_TEMP/ai-moa-release.alias")" ANDROID_RELEASE_KEY_PASSWORD="$(cat "$RUNNER_TEMP/ai-moa-release.key-password")" ANDROID_RELEASE_STORE_TYPE="$(cat "$RUNNER_TEMP/ai-moa-release.store-type")" flutter build apk --release --target-platform android-arm64 > "$RUNNER_TEMP/apk-build.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/apk-build.log"
          if [ "$result" -ne 0 ]; then
            python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          log = Path(os.environ['RUNNER_TEMP']) / 'apk-build.log'
          summary = log.read_text(errors='replace')[-45000:]
          payload = {'name': 'APK build diagnostics', 'head_sha': os.environ['GITHUB_SHA'], 'status': 'completed', 'conclusion': 'failure', 'output': {'title': 'Android compiler output', 'summary': summary}}
          (Path(os.environ['RUNNER_TEMP']) / 'apk-diagnostics.json').write_text(json.dumps(payload))
          PYCODE
            gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" --input "$RUNNER_TEMP/apk-diagnostics.json" > /dev/null
          fi
          exit "$result"
      - name: Verify APK signature
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/verify-apk-signature.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && 'ai-moa-test-signed-apk' || 'ai-moa-release-apk' }}
          path: build/app/outputs/flutter-apk/app-*.apk
      - name: Publish downloadable APK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" build/app/outputs/flutter-apk/app-release.apk --target "$GITHUB_SHA" --title "AI 모아 $tag" --notes "Android ARM64 APK. Signed with the fixed AI Moa release certificate. The first migration from development builds requires a reinstall; later higher-version builds use the same certificate."
      - name: Remove ephemeral signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/ai-moa-release.p12" "$RUNNER_TEMP/ai-moa-release.password" "$RUNNER_TEMP/ai-moa-release.key-password" "$RUNNER_TEMP/ai-moa-release.alias" "$RUNNER_TEMP/ai-moa-release.store-type"
    permissions:
      contents: write
      checks: write
